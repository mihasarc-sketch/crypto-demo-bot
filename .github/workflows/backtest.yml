name: Crypto Demo Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical strategy comparison
        run: python backtest.py
      - name: Save backtest results
        run: |
          git config user.name "Demo Backtest"
          git config user.email "demo-backtest@users.noreply.github.com"
          git add backtest_results.json
          git diff --cached --quiet || git commit -m "Update historical backtest results"
          git push
