
name: Crypto Demo Bot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run coin scanner
          run: python scanner.py

        - name: Run demo bot
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          run: python bot.py
      - name: Save account
        run: |
          git config user.name "Demo Bot"
          git config user.email "bot@example.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update demo account"
          git push
